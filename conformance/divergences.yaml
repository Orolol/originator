# Known, accepted divergences between the backend under test and the real-Hub recordings.
#
# A scenario fails on any mismatch NOT listed here. Each entry needs:
#   id        stable identifier (D-n)
#   scenario  scenario name (glob), e.g. owner-walkthrough, live:*
#   step      recorded step id (glob, or a list of globs)
#   field     diff field (glob, or a list): status, header:<name>, body, body$.<path>, body$...:keys, ...
#   rule      rule ID (behaviour.md) or question ID (open-questions.md) or KB section it rests on
#   reason    why it is accepted: "clone provisional choice", "recording artefact", "out of scope", ...
#   evidence  optional: file/section that justifies it
#
# Rule tests (pytest) use scenario "rules:<test module>" and step = test name; tests/conftest.py turns
# them into strict xfails (assertion unchanged; an unexpected pass fails the run). `field: "*"`.
#
# Never add an entry just to turn a test green: the reason must be traceable to the KB.

divergences:
  - id: D-1
    scenario: clone-seed-reads
    step: owner-head-lfs
    field: ["header:location", "header:link"]
    rule: out-of-scope.md "Real file serving (LFS/Xet, 302 to CDN)"
    reason: >-
      Out of scope. HF redirects an LFS/Xet file to its CDN (signed URL) and advertises Xet endpoints in
      Link; the clone serves stub bytes for authorised files and redirects to its own resolve-cache. The
      authorisation decision (302 for the owner, X-Repo-Commit, X-Linked-Size/-Etag) is still compared
      and matches.
    evidence: docs/hf-gated/out-of-scope.md; docs/hf-gated/observations/2026-10-05-clone-seed-reads.json owner-head-lfs

  - id: D-2
    scenario: anonymous-probes
    step: [raw-readme, blob-config]
    field: "*"
    rule: ACC-5 (/raw/ and /blob/ clause) vs docs/system.md "Backend surface"
    reason: >-
      Outside the backend surface. docs/system.md lists the only routes both backends serve and has no
      /raw/ or /blob/ route, so the clone answers 404 there; behaviour.md ACC-5 nevertheless records that
      HF gates them (anonymous 401 GatedRepo). KB inconsistency to resolve: either add the routes to the
      surface (and the clone) or scope ACC-5's /raw/ and /blob/ sentence out explicitly.
    evidence: docs/system.md "Backend surface"; docs/hf-gated/behaviour.md ACC-5; anonymous-probes raw-readme, blob-config

  - id: D-3
    scenario: "live:clone-seed-reads"
    step: whoami-bad-token
    field: "header:content-type"
    rule: docs/system.md "Personas" (invalid bearer -> HF's 401)
    reason: >-
      Bridge artefact, live mode only. The bridge never forwards an unknown bearer token: it answers the
      401 itself (system.md: "Any other bearer value -> 401 ... exactly what HF answers"), but with
      `application/json` where HF sends `application/json; charset=utf-8` (recorded). The status, message,
      body and WWW-Authenticate match. To fix in the bridge, not in the clone.
    evidence: docs/system.md "Personas"; observations/2026-10-05-clone-seed-reads.json whoami-bad-token

  - id: D-4
    scenario: "rules:test_rules_requests"
    step: test_REV_7_grant_on_non_gated_repo_is_400
    field: "*"
    rule: REV-7 vs open-questions.md "Provisional choices in the clone" (Q-9)
    reason: >-
      Clone provisional choice. behaviour.md REV-7 says granting on a non-gated repo answers 400
      [CLIENT doc]; the clone records "No 'repo not gated' 400 on grant/handle (wording unknown, and CFG-6
      shows the lists still work)" and answers 200 {}. Neither side is observed on the Hub. KB
      inconsistency: REV-7 should carry the Q-9 caveat, or grant on a non-gated repo should be recorded.
    evidence: docs/hf-gated/behaviour.md REV-7, CFG-6; docs/hf-gated/open-questions.md Q-9 provisional row
