# Replay scenarios: one per recording under docs/hf-gated/observations/.
#
#   recording     file name (probe format or bridge-log format)
#   covers        rule / question IDs the recording exercises (for the report)
#   stand_ins     true when some repos are local stand-ins for real repos (contents are stubs)
#   skip          step id -> reason. Only for steps OUTSIDE the backend surface (docs/system.md),
#                 never to hide a mismatch.
#   compare_only  step id -> {fields: [globs], reason}. Restricts the comparison to what the
#                 backend can legitimately reproduce (stand-in repos, HTML pages HF renders).
# Initial states live in src/conformance/seeds.py (scenario_seed), derived from each recording.

