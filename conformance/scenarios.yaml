# Live mode (-m live): read-only steps replayed against the bridge (BACKEND_URL=http://127.0.0.1:8100),
# no seeding. Only the 2026-10-06 set: the bridge's repo allowlist only lets the current sandbox
# (OwnerOfTheGatedModel/tiny-gated-model) through. Steps whose answer depends on the live request state
# (lists, report, gate messages) are left out: that state has moved since the recording. Repos other
# than the sandbox are refused by the allowlist, so they are left out too.
live:
  # owner-get-settings is left out: the bridge only routes PUT …/settings (BridgeRouteNotAllowed).
  2026-10-06/owner-reads: [owner-auth-check, owner-resolve]
  2026-10-06/clone-seed-reads: [model-info-anon, model-info-owner, model-info-expand, tree-main, tree-subdir,
                                whoami-owner, whoami-requester, whoami-anon, whoami-bad-token, owner-readme,
                                owner-gitattributes, owner-head-gitattributes, owner-config, anon-readme,
                                anon-head-readme]
  # tree-subdir-requester and raw-readme-requester depend on the requester's live request state.
  2026-10-06/tree-masking: [tree-subdir-anon, tree-subdir-owner, raw-readme-owner, raw-readme-anon]
